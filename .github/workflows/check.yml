name: Check PPI-2
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ppi
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: ppi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ppi -d ppi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://ppi:test-only@localhost:5432/ppi_test
      - run: npm run build
